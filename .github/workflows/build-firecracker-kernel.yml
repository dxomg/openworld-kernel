name: Build Firecracker kernel

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: Kernel ref to build (tag or branch of linux-stable)
        required: false
        default: 'linux-6.18.y'
      config_path:
        description: Path to the kernel config, relative to repo root
        required: false
        default: '.github/firecracker/kernel.config'
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: firecracker-kernel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            config_path: ${{ inputs.config_path || '.github/firecracker/kernel.config' }}
            install: ccache gcc make binutils flex bison bc libssl-dev libelf-dev cpio dwarves kmod perl
            file_match: 'ELF*x86-64*'
            strip_bin: strip
          - arch: arm64
            config_path: .github/firecracker/kernel.config.arm64
            install: ccache gcc make binutils gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu flex bison bc libssl-dev libelf-dev cpio dwarves kmod perl
            file_match: 'ELF*ARM*aarch64*'
            strip_bin: aarch64-linux-gnu-strip
    env:
      ARCH: ${{ matrix.arch }}
      CROSS_COMPILE: ${{ matrix.arch == 'arm64' && 'aarch64-linux-gnu-' || '' }}
      KERNEL_REF: ${{ inputs.kernel_ref || 'linux-6.18.y' }}
      CONFIG_PATH: ${{ matrix.config_path }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.KERNEL_REF }}-${{ matrix.arch }}-${{ hashFiles(matrix.config_path) }}
          restore-keys: |
            ccache-${{ env.KERNEL_REF }}-${{ matrix.arch }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.install }}

      - name: Fetch Linux source
        run: |
          git clone --depth 1 --single-branch \
            --branch "$KERNEL_REF" \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git linux

      - name: Configure
        working-directory: linux
        run: |
          cp "$GITHUB_WORKSPACE/$CONFIG_PATH" .config
          make olddefconfig

      - name: Build kernel
        working-directory: linux
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_MAXSIZE=2G
          make -j "$(nproc)" vmlinux

      - name: Package kernel
        working-directory: linux
        run: |
          VERSION="$(make kernelversion)"
          sanity_ok="$(file -b vmlinux)"
          if [[ "$sanity_ok" != ${{ matrix.file_match }} ]]; then
            echo "Unexpected kernel image type: $sanity_ok" >&2
            exit 1
          fi
          cp .config "$GITHUB_WORKSPACE/kernel-${{ matrix.arch }}-$VERSION.config"
          cp vmlinux "$GITHUB_WORKSPACE/vmlinux-${{ matrix.arch }}-$VERSION"
          ${{ matrix.strip_bin }} -g vmlinux -o "$GITHUB_WORKSPACE/vmlinux-${{ matrix.arch }}-$VERSION-stripped"
          cd "$GITHUB_WORKSPACE"
          sha256sum "vmlinux-${{ matrix.arch }}-$VERSION" "vmlinux-${{ matrix.arch }}-$VERSION-stripped" > SHA256SUMS-${{ matrix.arch }}
          echo "KERNEL_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firecracker-kernel-${{ matrix.arch }}-${{ env.KERNEL_VERSION }}
          path: |
            vmlinux-${{ matrix.arch }}-${{ env.KERNEL_VERSION }}
            vmlinux-${{ matrix.arch }}-${{ env.KERNEL_VERSION }}-stripped
            kernel-${{ matrix.arch }}-${{ env.KERNEL_VERSION }}.config
            SHA256SUMS-${{ matrix.arch }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: always() && !contains(needs.build.result, 'failure') && !contains(needs.build.result, 'cancelled')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release metadata
        run: |
          VERSION="$(sed -n -e 's/^[^ ]*  vmlinux-x86_64-//p' -e 's/^[^ ]*  vmlinux-arm64-//p' artifacts/SHA256SUMS-x86_64 artifacts/SHA256SUMS-arm64 | head -1)"
          BUILD_DATE="$(date -u +%Y-%m-%d)"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=kernel-$VERSION-$BUILD_DATE" >> "$GITHUB_ENV"

      - name: Create release
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists - recreating it."
            gh release delete "$RELEASE_TAG" --yes
          fi
          gh release create "$RELEASE_TAG" \
            artifacts/vmlinux-* artifacts/kernel-*.config artifacts/SHA256SUMS-* \
            --title "Firecracker kernel $RELEASE_VERSION ($BUILD_DATE)" \
            --notes "Weekly Firecracker microVM kernel build for Linux $RELEASE_VERSION. x86_64 and arm64 images (unstripped and stripped), per-arch kernel configs and SHA256 checksums."

      - name: Verify release
        run: gh release view "$RELEASE_TAG" --json name,assets --jq '.name, (.assets[].name)'